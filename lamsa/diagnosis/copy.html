<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMSA 触れ合い＆スキンシップタイプ診断</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lamsa: {
                            bg: '#FAF7F2',
                            card: '#F4EFE6',
                            accent: '#D4A373',
                            glow: '#E8B993',
                            text: '#4A4238',
                            muted: '#8C8275',
                            dark: '#2A241E',
                            gold: '#C59B63'
                        }
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', 'serif'],
                        sans: ['"Zen Kaku Gothic New"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FAF7F2;
            color: #4A4238;
            font-family: 'Zen Kaku Gothic New', sans-serif;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 185, 147, 0.35) 0%, rgba(250, 247, 242, 0) 70%);
            filter: blur(50px);
            pointer-events: none;
        }
        .custom-checkbox:checked + div {
            background-color: #C59B63;
            border-color: #C59B63;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center justify-center relative overflow-x-hidden">

    <!-- 背景装飾オーブ -->
    <div class="glow-orb w-96 h-96 -top-20 -left-20"></div>
    <div class="glow-orb w-96 h-96 -bottom-20 -right-20"></div>

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-[#E8E1D5] overflow-hidden relative z-10">
        
        <!-- ヘッダー -->
        <div class="bg-[#F4EFE6] px-6 py-8 text-center border-b border-[#E8E1D5] relative">
            <div class="text-[10px] tracking-[0.3em] font-serif text-lamsa-gold uppercase mb-1">Self Check Diagnosis</div>
            <h1 class="text-2xl font-serif text-lamsa-dark tracking-widest font-semibold">LAMSA 触れ合い診断</h1>
            <p class="text-xs text-lamsa-muted mt-2 font-light">今のあなたとパートナーの「エネルギー循環」をチェック</p>

            <!-- 性別切り替えタブ -->
            <div class="flex bg-white rounded-full p-1 mt-6 border border-[#E8E1D5] shadow-inner">
                <button id="tab-female" onclick="switchGender('female')" class="flex-1 py-2 text-xs font-serif rounded-full transition-all duration-300 bg-lamsa-gold text-white shadow-sm">
                    🌸 女性向け（愛＆エネルギー）
                </button>
                <button id="tab-male" onclick="switchGender('male')" class="flex-1 py-2 text-xs font-serif rounded-full transition-all duration-300 text-lamsa-muted hover:text-lamsa-dark">
                    🕺 男性向け（気遣い＆感度）
                </button>
            </div>
        </div>

        <!-- コンテンツエリア -->
        <div class="p-6">
            
            <!-- 説明文 -->
            <div id="intro-text" class="text-xs text-lamsa-text leading-relaxed font-light mb-6 bg-[#FAF7F2] p-4 rounded-2xl border border-[#E8E1D5]">
                当てはまる項目にチェックを入れてください。あなたの今の状態と、愛を深めるための鍵が分かります。
            </div>

            <!-- チェックボックスリスト (JSで動的生成) -->
            <form id="diagnosis-form" class="space-y-3">
                <!-- ここに項目が入ります -->
            </form>

            <!-- 診断ボタン -->
            <button onclick="calculateResult()" type="button" class="w-full mt-8 bg-lamsa-dark text-white font-serif py-4 rounded-2xl text-xs tracking-[0.2em] hover:bg-lamsa-gold transition-all shadow-md">
                診断結果を見る ✨
            </button>

            <!-- 診断結果表示エリア (初期非表示) -->
            <div id="result-box" class="hidden mt-8 pt-8 border-t border-[#E8E1D5] space-y-6 animate-fadeIn">
                <div class="text-center">
                    <span class="text-[10px] font-serif uppercase tracking-widest text-lamsa-gold bg-[#F4EFE6] px-3 py-1 rounded-full">Your Diagnosis</span>
                    <h2 id="result-title" class="text-xl font-serif text-lamsa-dark mt-3 tracking-wider font-bold"></h2>
                    <p id="result-subtitle" class="text-xs text-lamsa-gold font-serif mt-1"></p>
                </div>

                <div id="result-desc" class="text-xs text-lamsa-text leading-relaxed font-light bg-[#FAF7F2] p-5 rounded-2xl border border-[#E8E1D5]">
                </div>

                <div class="bg-[#F4EFE6] p-5 rounded-2xl space-y-2 border border-[#E2D8C8]">
                    <div class="text-xs font-serif text-lamsa-dark font-medium flex items-center gap-2">
                        <i class="fa-solid fa-sparkles text-lamsa-gold"></i>
                        <span>愛とエネルギーを高める処方箋</span>
                    </div>
                    <p id="result-advice" class="text-xs text-lamsa-text font-light leading-relaxed"></p>
                </div>

                <div class="text-center pt-2">
                    <a href="https://www.instagram.com/lamsa_lsn" target="_blank" class="inline-flex items-center justify-center gap-2 w-full bg-gradient-to-r from-[#833AB4] via-[#FD1D1D] to-[#F77737] text-white py-3.5 rounded-xl font-serif text-xs tracking-widest shadow-sm">
                        <i class="fa-brands fa-instagram text-base"></i>
                        <span>LAMSAの触れるレッスンで体験する</span>
                    </a>
                </div>
            </div>

        </div>

        <!-- フッター -->
        <div class="bg-[#FAF7F2] py-4 text-center border-t border-[#E8E1D5]">
            <p class="font-serif text-[10px] text-lamsa-muted tracking-widest">LAMSA ｜ ひとふれて、変わる。</p>
        </div>

    </div>

    <script>
        let currentGender = 'female';

        const questionsData = {
            female: [
                { id: 'f1', text: '「触れられる」ことで、頭ではなく全身で愛を感じたい' },
                { id: 'f2', text: '言葉や形だけでなく、パートナーと心と体のエネルギー交流をしたい' },
                { id: 'f3', text: '普段頑張りすぎていて、スキンシップの時くらい力を抜いて委ねたい' },
                { id: 'f4', text: 'ただ触れ合うだけで「愛されている」という深い安心感に包まれたい' },
                { id: 'f5', text: '彼をもっと夢中にさせたいけれど、激しいことより深い愛を育みたい' }
            ],
            male: [
                { id: 'm1', text: '彼女を「満足させられているか」実は自己流で少し不安がある' },
                { id: 'm2', text: 'スキンシップがベッドタイム（夜）だけになりがちだと感じている' },
                { id: 'm3', text: '力任せではなく、女性がうっとりする繊細なタッチを身につけたい' },
                { id: 'm4', text: '「上手いね」だけでなく「大切にされている」と思わせる男性になりたい' },
                { id: 'm5', text: '彼女から「またやって」とねだられる心地よい触れ方を知りたい' }
            ]
        };

        const resultsData = {
            female: [
                {
                    min: 0, max: 1,
                    title: '「これから深まる」蕾（つぼみ）タイプ',
                    subtitle: '~ スキンシップの本当の気持ちよさを開花させる手前 ~',
                    desc: 'まだ触れ合いによるエネルギーの循環や深い解放感を体験しきれていない状態かも。緊張や遠慮を脱ぎ捨てて、ただ身を委ねる喜びを知ると、パートナーシップがガラッと変わります。',
                    advice: 'まずはパウダーを使った「力を必要としない繊細なフェザータッチ」で、心地よさを受け取る練習から始めましょう。'
                },
                {
                    min: 2, max: 3,
                    title: '「愛の循環を求める」ヒーリングタイプ',
                    subtitle: '~ 肌を通じて安心感とエネルギーを満たしたい状態 ~',
                    desc: '言葉以上の愛や安心感を求めているタイプです。日常の忙しさやストレスで硬くなった心を、触れ合いによって解きほぐしたいという純粋な願いを持っています。',
                    advice: '日常の中にサッと取り入れられるスキンシップの習慣を作ることで、心と体のエネルギーが満たされ、内なる魅力が開花します。'
                },
                {
                    min: 4, max: 5,
                    title: '「魂で深く繋がる」フュージョンタイプ',
                    subtitle: '~ 単なるスキンシップを超えた、極上のエネルギー交流を欲する段階 ~',
                    desc: '触れ合うこと＝お互いの愛と魂のエネルギーを交換することだと直感的に理解している感性の高いタイプです。表面的な触れ合いでは満足できず、より深い一体感を求めています。',
                    advice: 'パウダーマッサージによる極上の感触体験を通して、お互いの魂が共鳴するような深い触れ合いのレッスンが最適です。'
                }
            ],
            male: [
                {
                    min: 0, max: 1,
                    title: '「自己流抜け出し予備軍」ビギナータイプ',
                    subtitle: '~ 気遣いはあるけれど、触れ方の正解を模索中 ~',
                    desc: '彼女を喜ばせたい気持ちはあるものの、何をどうすれば女性が本当に喜ぶのか具体的なテクニックやマインドを知る機会がなかったタイプです。',
                    advice: '女性の肌の感度は、男性の想像以上に繊細です。力任せではない「フェザータッチの基本法則」を学ぶことで一気に変化します。'
                },
                {
                    min: 2, max: 3,
                    title: '「大人の気遣いマスター」追求タイプ',
                    subtitle: '~ ベッドタイムだけじゃない「安心感」を届けたい男性 ~',
                    desc: '単なる技術だけでなく、彼女に「大切にされている」という安心感を与えたいという高い美意識を持っています。あと一歩で圧倒的なモテ・愛され男性へ。',
                    advice: 'パウダーを使った滑らかな触れ方を身につけることで、普段の何気ないスキンシップから彼女を虜にできるようになります。'
                },
                {
                    min: 4, max: 5,
                    title: '「極上の癒やしを与える」洗練紳士タイプ',
                    subtitle: '~ 女性の感度と感情を開花させる真のリーダー ~',
                    desc: '女性の本音や感度に寄り添い、触れ合いを通じて最高の幸福感を与えたいと願う洗練された男性です。自己満足ではなく相手を慈しむ術を求めています。',
                    advice: 'LAMSAの対面レッスンで「直接手に取る感触と答え合わせ」を行うことで、二度と忘れられない極上の触れ合いを体得できます。'
                }
            ]
        };

        function switchGender(gender) {
            currentGender = gender;
            const btnF = document.getElementById('tab-female');
            const btnM = document.getElementById('tab-male');

            if (gender === 'female') {
                btnF.className = "flex-1 py-2 text-xs font-serif rounded-full transition-all duration-300 bg-lamsa-gold text-white shadow-sm";
                btnM.className = "flex-1 py-2 text-xs font-serif rounded-full transition-all duration-300 text-lamsa-muted hover:text-lamsa-dark";
            } else {
                btnM.className = "flex-1 py-2 text-xs font-serif rounded-full transition-all duration-300 bg-lamsa-dark text-white shadow-sm";
                btnF.className = "flex-1 py-2 text-xs font-serif rounded-full transition-all duration-300 text-lamsa-muted hover:text-lamsa-dark";
            }

            document.getElementById('result-box').classList.add('hidden');
            renderQuestions();
        }

        function renderQuestions() {
            const form = document.getElementById('diagnosis-form');
            const list = questionsData[currentGender];
            form.innerHTML = list.map(q => `
                <label class="flex items-center gap-3 p-3.5 bg-[#FAF7F2] rounded-xl border border-[#E8E1D5] cursor-pointer hover:bg-[#F4EFE6] transition-colors">
                    <input type="checkbox" value="${q.id}" class="custom-checkbox hidden">
                    <div class="w-5 h-5 rounded-md border border-[#C59B63] flex items-center justify-center text-xs transition-all flex-shrink-0">
                        <i class="fa-solid fa-check text-[10px]"></i>
                    </div>
                    <span class="text-xs text-lamsa-dark font-light leading-snug">${q.text}</span>
                </label>
            `).map(item => item).join('');
        }

        function calculateResult() {
            const checkboxes = document.querySelectorAll('#diagnosis-form input[type="checkbox"]:checked');
            const count = checkboxes.length;
            const results = resultsData[currentGender];

            const result = results.find(r => count >= r.min && count <= r.max) || results[0];

            document.getElementById('result-title').innerText = result.title;
            document.getElementById('result-subtitle').innerText = result.subtitle;
            document.getElementById('result-desc').innerText = result.desc;
            document.getElementById('result-advice').innerText = result.advice;

            const resultBox = document.getElementById('result-box');
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth' });
        }

        // 初期表示
        renderQuestions();
    </script>
</body>
</html>
